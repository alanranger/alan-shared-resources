  "description": "Join me on this landscape photography Snowdonia workshop in the iconic mountains, quarries and landscape of Snowdonia national park.Summary - Snowdonia Landscape photography workshopLocation:Wales - Snowdonia National ParkDates: Sat 26th - Sun 27th Sep 2026 - 2 Days/1 NightParticipants: Max 4 (1 Car, transport between locations included)Fitness: 2. Moderate (15-30 min walks)Experience Level: Beginner to AdvancedEquipment Needed: DSLR or Mirrorless Camera and TripodPhotography Workshop Event Details SnowdoniaDescription: This is a 2-day, 1-night residential landscape photography workshop in Snowdonia National Park, North Wales — open to all levels from beginner to advanced. Home to the highest mountain ranges in England and Wales, Snowdonia is a landscape that will both inspire and challenge any photographer: rugged peaks and flowing rivers, serene lakes and ancient slate quarries, all within a compact corner of Wales that you'll learn to read and photograph in its ever-changing light.What makes Snowdonia so rewarding is its variety, and over two days we work three very different faces of it: the waterfalls and rivers that are perfect for long exposure, turning moving water to silk; the starker, striking world of the historic slate quarries and mining relics, where industry and mountain meet; and the majestic lakes, where still water mirrors the peaks for compelling, reflective compositions. Across all of it the focus stays on the same craft — composing order from a vast scene, controlling exposure across big tonal ranges, and timing your shoot to the light and weather that shift the mood from rugged to serene and back. And throughout, the emphasis isn't just on the grand vista but on learning to see it — working intimate detail as readily as the wide view, and reading light and colour as a harmony rather than chasing the obvious shot.With a maximum of just four photographers and transport between locations included, this is genuinely personal tuition — Alan plans each day around the season and the forecast, and sends a detailed location itinerary a few days ahead. Likely locations include the reflective waters of Llynnau Mymbyr beneath the Snowdon massif, the Capel Curig pinnacles, Swallow Falls and the hidden lake of Llyn Craftnant. Accommodation and breakfast are included, so all you have to think about is your photography — and you'll leave with a varied portfolio that captures both the drama and the stillness of this remarkable landscape. An extra night's accommodation is available the day before if required — please request in advance, subject to hotel availability.",
