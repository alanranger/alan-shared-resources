adily as the wide moorland vista, and treating the purple, the gold and the low light as a harmony rather than a colour to crank. We shoot two to three locations each session as conditions allow, and the aim throughout is an image with mood and restraint — one that feels like that moor at first or last light.It's a small group of no more than six, taught personally and pitched at exactly your level, with one-to-one guidance in the field throughout. Whether you take the sunset, the sunrise or make a weekend of both, you'll come away with a portfolio of the Peak District's heather at its peak — and a sharper, more intentional way of seeing colour, light and landscape that you can take anywhere. If you're booking both sessions, please arrange your own overnight accommodation near The Roaches for the early sunrise shoot. Please also note this is a seasonal workshop tied to the heather bloom, so exact dates may shift slightly with the season.",
