d breakfast are included, so all you have to think about is your photography, and you'll come away with a varied portfolio of the Yorkshire Dales — waterfalls, limestone pavements, viaducts and classic vistas — and the field craft to capture dramatic upland landscape anywhere. An extra night's accommodation is available the day before if required — please request in advance, subject to hotel availability.",
